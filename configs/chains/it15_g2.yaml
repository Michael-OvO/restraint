name: it15g2
state_dir: outputs/chain/it15g2
sequential: false
instance_id: null
balance_floor: 8
final:
  command: 'true'
  timeout_min: 5
steps:
- name: train_g2
  command: scripts/run_sft.sh configs/sft_judgment_splice_g2_qwen35.yaml model.name=outputs/it14/sft_v2_e3_merged
  gpus:
  - 0
  done: outputs/sft/it15-g2-splice-replay/final/adapter_config.json
  after: []
  timeout_min: 300
  on_failure: stop
  env:
    CUDA_VISIBLE_DEVICES: '0'
    WANDB_PROJECT: honest-agents
    WANDB_ENTITY: michael_ovo
    WANDB_RUN_GROUP: it15
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
- name: merge_g2
  command: env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.sft.merge --base outputs/it14/sft_v2_e3_merged
    --adapter outputs/sft/it15-g2-splice-replay/final --out outputs/it15/g2_merged
  gpus: []
  done: outputs/it15/g2_merged/config.json
  after:
  - train_g2
  timeout_min: 30
  on_failure: stop
- name: g2_evals
  command: scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g2_merged -- env -u VIRTUAL_ENV uv
    run --frozen --extra train --extra eval python -m honest_agents.eval.decision_probe --prompts data/decision/probe_prompts_surfaces.jsonl
    --out runs/probe/it15_g2 --base-url http://localhost:8000/v1 --model policy -- scripts/eval_heldout.sh data/decision/surfaces_val/tasks
    runs/eval/it15_g2_surface4 --n-samples 4 --concurrency 24 --train-config configs/grpo_it13_2gpu.yaml -- scripts/eval_heldout.sh
    data/probe_v1.jsonl runs/eval/it15_g2_tierS --n-samples 2 --concurrency 24 --train-config configs/grpo_it13_2gpu.yaml
  gpus:
  - 0
  done: runs/eval/it15_g2_tierS/metrics.json
  after:
  - merge_g2
  timeout_min: 240
  on_failure: continue
  env:
    VLLM_GPUS: '0'
    VLLM_PORT: '8000'
    VLLM_GPU_MEM: '0.85'
    BASE_URL: http://localhost:8000/v1
    MODEL: policy
