              runs/eval/it16d_g2_tierS, runs/eval/it16d_g2_blind,
              runs/eval/it16_final_sanity, runs/eval/it16d_final_surface, runs/eval/it16d_final_tierF,
              runs/eval/it16d_final_tierS, runs/eval/it16d_final_blind,
              runs/eval/it16d_base_rts, runs/eval/it16d_g2_rts, runs/eval/it16d_final_rts],
