# Iteration 16, stage (d): the final eval of all three arms (docs/iteration-16-prereg.md sections 2, 4 and 8). base
# (Qwen/Qwen3.5-4B at its pin), G2 seed 1 (rebuilt on CPU) and final (the epoch stage (c) selected, rebuilt from its
# archived adapter onto G2), in that order, one vLLM server per arm per step, on GPU 0 (no training here), same items,
# harness, system prompt and sampling settings. One look: each benchmark is evaluated once per arm; a step that failed
# is resumed (done markers), never re-run for a better number. The calibration episodes of stage (a) are not reused.
# Per arm: the 12-task sanity run; internal (surface-val-v2 x 4, tier F x 4, tier S x 4, the blind held-out family x 4,
# the archived decision probe x 8, the flip-test probe); external (TB2 x 4, ImpossibleBench LCB x 4, Agentic Abstention
# x 4, AbstentionBench); then the units files of all four external benchmarks, one run each (`units --single`; the
# ImpossibleBench scorer takes one job dir). Last, `final_benchmark compute` fills the arms' results and deltas into a
# copy of the manifest for TB2, ImpossibleBench LCB, Agentic Abstention and AbstentionBench (incl. the over-abstention
# guard, prereg section 4). The manifest's internal_heldout entry has no units writer: the internal splits are read by
# the pre-registered estimator on the Mac (runbook section 7). MASK is not here: its judge is paid (separate owner
# approval, prereg section 4).
# The secondary RTS endpoint (prereg section 6.5, amended 2026-10-26): after its units, each arm is served once more
# for the frozen rts/v1 items (S = 1) and scored onto the stage's own board (`scoreboard add`), base first; last,
# `scoreboard delta` (final vs base, G2 vs base) and `scoreboard plot --wandb`. `rts_freeze_check` refuses the stage
# unless the manifest matches its sidecar, that digest is the one written into the prereg and the task dirs and
# protocol are the frozen ones; `rts_mde` computes the RTS MDE from the base arm alone before any trained arm's run.
# Runbook: docs/iteration-16-runbook.md. NOT LAUNCHABLE YET (placeholders, refused by `node chain` and `run`):
#   <SURFACE_VAL_V2>: the frozen held-out surface build (68+ sources x 6 surfaces), task dir; frozen at sign-off.
#   <BLIND_FAMILY_SPLIT>: the blind held-out family's split (fixed at build, never opened before this eval).
#   <FLIP_PROMPTS>: the (a)/(b) flip-test prompts (commit_points.flip_probe, held-out sources), built with the data.
#   <ABENCH_JUDGE_URL>: the AbstentionBench judge endpoint, on a GPU that is not the policy's; the export must be the
#     one the manifest froze (DEF-50).
#   <RTS_MANIFEST>: the frozen RTS manifest, data/rts/v1/manifest.jsonl (its task dirs are data/rts/v1/tasks), once
#     `eval.rts.build freeze` has written it and its sha256 is in prereg section 6.5.
# NOT APPROVED, and gated: the first step refuses while any defect in docs/defects.md is open.
name: it16d
state_dir: outputs/chain/it16d
sequential: true
instance_id: null
balance_floor: 8
steps:
  - name: gate_ledger
    command: >-
      env -u VIRTUAL_ENV uv run --frozen python -m honest_agents.gate.ledger check --experiment it16d
      --ledger docs/defects.md
      --json outputs/chain/it16d/gate_ledger.json
      && mkdir -p outputs/chain/it16d/markers && touch outputs/chain/it16d/markers/gate_ledger.done
    gpus: []
    done: outputs/chain/it16d/markers/gate_ledger.done
    after: []
    timeout_min: 5
    on_failure: stop

  # The frozen manifest is consistent and no training build of this tree holds a benchmark item (never-trained).
  - name: freeze_checks
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark check
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark never-trained
      --out outputs/chain/it16d/never_trained.json
      && touch outputs/chain/it16d/markers/freeze_checks.done
    gpus: []
    done: outputs/chain/it16d/markers/freeze_checks.done
    timeout_min: 20
    on_failure: stop

  # The RTS manifest is the frozen one (eval.rts.verify): it matches its sidecar, that digest is the one prereg 6.5
  # records, every item's task dir under data/rts/v1/tasks still hashes as frozen and no other dir is there, and
  # protocol.json is the pre-registered one. Stage (c) runs the same check before its first final-arm episode.
  - name: rts_freeze_check
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.rts.verify
      --manifest <RTS_MANIFEST> --prereg docs/iteration-16-prereg.md
      && touch outputs/chain/it16d/markers/rts_freeze_check.done
    gpus: []
    done: outputs/chain/it16d/markers/rts_freeze_check.done
    timeout_min: 5
    on_failure: stop

  - name: merge_sft_v2
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.sft.merge --base Qwen/Qwen3.5-4B
      --adapter data/weights/it14/sft-v2-e3-final --out outputs/it14/sft_v2_e3_merged
    gpus: []
    done: outputs/it14/sft_v2_e3_merged/config.json
    timeout_min: 30
    on_failure: stop

  - name: merge_g2
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.sft.merge
      --base outputs/it14/sft_v2_e3_merged --adapter data/weights/it15/g2-s1-final --out outputs/it15/g2_merged
    gpus: []
    done: outputs/it15/g2_merged/config.json
    timeout_min: 30
    on_failure: stop

  # The final arm: the adapter of the epoch stage (c) selected (its best_checkpoint.json), staged under data/weights.
  - name: merge_final
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.sft.merge
      --base outputs/it15/g2_merged --adapter data/weights/it16/final-selected --out outputs/it16/final_merged
    gpus: []
    done: outputs/it16/final_merged/config.json
    timeout_min: 30
    on_failure: stop

  - name: ib_tasks
    command: >-
      (cd data/ext/impossiblebench && sha256sum --check --strict --quiet MANIFEST.sha256)
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench
      materialize --data data/ext/impossiblebench/hf/impossible_livecodebench --out outputs/it16/ib_lcb_tuned
      --prompt tuned
      && touch outputs/chain/it16d/markers/ib_tasks.done
    gpus: []
    done: outputs/chain/it16d/markers/ib_tasks.done
    timeout_min: 20
    on_failure: stop

  - name: base_sanity
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/val.jsonl runs/eval/it16_base_sanity --limit 12 --n-samples 1 --concurrency 12
      --train-config configs/grpo_it13_2gpu.yaml
    gpus: [0]
    done: runs/eval/it16_base_sanity/metrics.json
    timeout_min: 45
    on_failure: stop
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: base_internal
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh <SURFACE_VAL_V2> runs/eval/it16d_base_surface --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/val.jsonl runs/eval/it16d_base_tierF --n-samples 4 --concurrency 28
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/probe_v1.jsonl runs/eval/it16d_base_tierS --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh <BLIND_FAMILY_SPLIT> runs/eval/it16d_base_blind --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.decision_probe
      --prompts data/decision/probe_prompts_surfaces.jsonl --out runs/probe/it16d_base --n 8
      --base-url http://localhost:8000/v1 --model policy
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.decision_probe
      --prompts <FLIP_PROMPTS> --out runs/probe/it16d_base_flip --n 8 --base-url http://localhost:8000/v1 --model policy
      && touch outputs/chain/it16d/markers/base_internal.done
    gpus: [0]
    done: outputs/chain/it16d/markers/base_internal.done
    timeout_min: 660
    on_failure: stop
    stall_min: 45
    progress: {pattern: 'serve_and_run: command (\d+):', total: 7}
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: base_external
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml
      -- env N_CONCURRENT=12 scripts/eval_tb.sh tb2 runs/harbor/it16d_base_tb2 -k 4
      -- env N_CONCURRENT=24 scripts/eval_tb.sh outputs/it16/ib_lcb_tuned runs/harbor/it16d_base_ib -k 4
      -- env TAG=it16d_base N_ATTEMPTS=4 N_CONCURRENT=12 scripts/eval_agentic_abstention.sh runs/harbor/it16d_base_aa
      -- env JUDGE_BASE_URL=<ABENCH_JUDGE_URL> scripts/eval_abstentionbench.sh runs/abstentionbench/it16d_base
      && touch outputs/chain/it16d/markers/base_external.done
    gpus: [0]
    done: outputs/chain/it16d/markers/base_external.done
    timeout_min: 660
    on_failure: stop
    stall_min: 45
    progress: {pattern: 'serve_and_run: command (\d+):', total: 4}
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: base_units
    command: >-
      mkdir -p runs/final/it16d
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units
      --single --bench terminal_bench_2 runs/harbor/it16d_base_tb2/tb2__* --out runs/final/it16d/base_tb2_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench score
      runs/harbor/it16d_base_ib/ib_lcb_tuned__* --out runs/final/it16d/base_ib_summary.json
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units --single
      --bench agentic_abstention runs/harbor/it16d_base_aa/agentic_abstention_immediate__*/agentic_abstention_summary.json
      --out runs/final/it16d/base_aa_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units --single
      --bench abstentionbench runs/abstentionbench/it16d_base/responses.jsonl --out runs/final/it16d/base_abench_units.json
      && touch outputs/chain/it16d/markers/base_units.done
    gpus: []
    done: outputs/chain/it16d/markers/base_units.done
    timeout_min: 30
    on_failure: stop

  # RTS (prereg 6.5): every frozen item once, then the run's row on the stage's board.
  - name: base_rts
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/rts/v1/tasks runs/eval/it16d_base_rts --n-samples 1 --concurrency 12
      --train-config configs/grpo_it13_2gpu.yaml
      && env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.rts.scoreboard add
      --run runs/eval/it16d_base_rts --manifest <RTS_MANIFEST> --label base --order 0
      --board runs/rts/it16d/scoreboard.json --units-dir runs/rts/it16d/units
      && touch outputs/chain/it16d/markers/base_rts.done
    gpus: [0]
    done: outputs/chain/it16d/markers/base_rts.done
    timeout_min: 480
    on_failure: stop
    stall_min: 45
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  # RTS power (prereg 6.5, spec section 6): the MDE from the base arm's units alone, before any trained arm's RTS run
  # exists (every g2_* and final_* step comes after this one). Reported; it never moves a bar.
  - name: rts_mde
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.analysis.power rts
      --units runs/rts/it16d/units/base.json --json runs/rts/it16d/mde_base.json
      && touch outputs/chain/it16d/markers/rts_mde.done
    gpus: []
    done: outputs/chain/it16d/markers/rts_mde.done
    timeout_min: 10
    on_failure: stop

  - name: g2_sanity
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g2_merged
      -- scripts/eval_heldout.sh data/val.jsonl runs/eval/it16_g2_sanity --limit 12 --n-samples 1 --concurrency 12
      --train-config configs/grpo_it13_2gpu.yaml
    gpus: [0]
    done: runs/eval/it16_g2_sanity/metrics.json
    timeout_min: 45
    on_failure: stop
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: g2_internal
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g2_merged
      -- scripts/eval_heldout.sh <SURFACE_VAL_V2> runs/eval/it16d_g2_surface --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/val.jsonl runs/eval/it16d_g2_tierF --n-samples 4 --concurrency 28
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/probe_v1.jsonl runs/eval/it16d_g2_tierS --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh <BLIND_FAMILY_SPLIT> runs/eval/it16d_g2_blind --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.decision_probe
      --prompts data/decision/probe_prompts_surfaces.jsonl --out runs/probe/it16d_g2 --n 8
      --base-url http://localhost:8000/v1 --model policy
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.decision_probe
      --prompts <FLIP_PROMPTS> --out runs/probe/it16d_g2_flip --n 8 --base-url http://localhost:8000/v1 --model policy
      && touch outputs/chain/it16d/markers/g2_internal.done
    gpus: [0]
    done: outputs/chain/it16d/markers/g2_internal.done
    timeout_min: 660
    on_failure: stop
    stall_min: 45
    progress: {pattern: 'serve_and_run: command (\d+):', total: 7}
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: g2_external
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g2_merged
      -- env N_CONCURRENT=12 scripts/eval_tb.sh tb2 runs/harbor/it16d_g2_tb2 -k 4
      -- env N_CONCURRENT=24 scripts/eval_tb.sh outputs/it16/ib_lcb_tuned runs/harbor/it16d_g2_ib -k 4
      -- env TAG=it16d_g2 N_ATTEMPTS=4 N_CONCURRENT=12 scripts/eval_agentic_abstention.sh runs/harbor/it16d_g2_aa
      -- env JUDGE_BASE_URL=<ABENCH_JUDGE_URL> scripts/eval_abstentionbench.sh runs/abstentionbench/it16d_g2
      && touch outputs/chain/it16d/markers/g2_external.done
    gpus: [0]
    done: outputs/chain/it16d/markers/g2_external.done
    timeout_min: 660
    on_failure: stop
    stall_min: 45
    progress: {pattern: 'serve_and_run: command (\d+):', total: 4}
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: g2_units
    command: >-
      mkdir -p runs/final/it16d
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units
      --single --bench terminal_bench_2 runs/harbor/it16d_g2_tb2/tb2__* --out runs/final/it16d/g2_tb2_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench score
      runs/harbor/it16d_g2_ib/ib_lcb_tuned__* --out runs/final/it16d/g2_ib_summary.json
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units --single
      --bench agentic_abstention runs/harbor/it16d_g2_aa/agentic_abstention_immediate__*/agentic_abstention_summary.json
      --out runs/final/it16d/g2_aa_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units --single
      --bench abstentionbench runs/abstentionbench/it16d_g2/responses.jsonl --out runs/final/it16d/g2_abench_units.json
      && touch outputs/chain/it16d/markers/g2_units.done
    gpus: []
    done: outputs/chain/it16d/markers/g2_units.done
    timeout_min: 30
    on_failure: stop

  # RTS (prereg 6.5): every frozen item once, then the run's row on the stage's board.
  - name: g2_rts
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g2_merged
      -- scripts/eval_heldout.sh data/rts/v1/tasks runs/eval/it16d_g2_rts --n-samples 1 --concurrency 12
      --train-config configs/grpo_it13_2gpu.yaml
      && env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.rts.scoreboard add
      --run runs/eval/it16d_g2_rts --manifest <RTS_MANIFEST> --label it15-g2-s1 --order 1 --adapter data/weights/it15/g2-s1-final
      --board runs/rts/it16d/scoreboard.json --units-dir runs/rts/it16d/units
      && touch outputs/chain/it16d/markers/g2_rts.done
    gpus: [0]
    done: outputs/chain/it16d/markers/g2_rts.done
    timeout_min: 480
    on_failure: stop
    stall_min: 45
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: final_sanity
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it16/final_merged
      -- scripts/eval_heldout.sh data/val.jsonl runs/eval/it16_final_sanity --limit 12 --n-samples 1 --concurrency 12
      --train-config configs/grpo_it13_2gpu.yaml
    gpus: [0]
    done: runs/eval/it16_final_sanity/metrics.json
    timeout_min: 45
    on_failure: stop
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: final_internal
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it16/final_merged
      -- scripts/eval_heldout.sh <SURFACE_VAL_V2> runs/eval/it16d_final_surface --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/val.jsonl runs/eval/it16d_final_tierF --n-samples 4 --concurrency 28
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/probe_v1.jsonl runs/eval/it16d_final_tierS --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh <BLIND_FAMILY_SPLIT> runs/eval/it16d_final_blind --n-samples 4 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.decision_probe
      --prompts data/decision/probe_prompts_surfaces.jsonl --out runs/probe/it16d_final --n 8
      --base-url http://localhost:8000/v1 --model policy
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.decision_probe
      --prompts <FLIP_PROMPTS> --out runs/probe/it16d_final_flip --n 8 --base-url http://localhost:8000/v1 --model policy
      && touch outputs/chain/it16d/markers/final_internal.done
    gpus: [0]
    done: outputs/chain/it16d/markers/final_internal.done
    timeout_min: 660
    on_failure: stop
    stall_min: 45
    progress: {pattern: 'serve_and_run: command (\d+):', total: 7}
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: final_external
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it16/final_merged
      -- env N_CONCURRENT=12 scripts/eval_tb.sh tb2 runs/harbor/it16d_final_tb2 -k 4
      -- env N_CONCURRENT=24 scripts/eval_tb.sh outputs/it16/ib_lcb_tuned runs/harbor/it16d_final_ib -k 4
      -- env TAG=it16d_final N_ATTEMPTS=4 N_CONCURRENT=12 scripts/eval_agentic_abstention.sh runs/harbor/it16d_final_aa
      -- env JUDGE_BASE_URL=<ABENCH_JUDGE_URL> scripts/eval_abstentionbench.sh runs/abstentionbench/it16d_final
      && touch outputs/chain/it16d/markers/final_external.done
    gpus: [0]
    done: outputs/chain/it16d/markers/final_external.done
    timeout_min: 660
    on_failure: stop
    stall_min: 45
    progress: {pattern: 'serve_and_run: command (\d+):', total: 4}
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: final_units
    command: >-
      mkdir -p runs/final/it16d
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units
      --single --bench terminal_bench_2 runs/harbor/it16d_final_tb2/tb2__* --out runs/final/it16d/final_tb2_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench score
      runs/harbor/it16d_final_ib/ib_lcb_tuned__* --out runs/final/it16d/final_ib_summary.json
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units --single
      --bench agentic_abstention runs/harbor/it16d_final_aa/agentic_abstention_immediate__*/agentic_abstention_summary.json
      --out runs/final/it16d/final_aa_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units --single
      --bench abstentionbench runs/abstentionbench/it16d_final/responses.jsonl --out runs/final/it16d/final_abench_units.json
      && touch outputs/chain/it16d/markers/final_units.done
    gpus: []
    done: outputs/chain/it16d/markers/final_units.done
    timeout_min: 30
    on_failure: stop

  # RTS (prereg 6.5): every frozen item once, then the run's row on the stage's board.
  - name: final_rts
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it16/final_merged
      -- scripts/eval_heldout.sh data/rts/v1/tasks runs/eval/it16d_final_rts --n-samples 1 --concurrency 12
      --train-config configs/grpo_it13_2gpu.yaml
      && env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.rts.scoreboard add
      --run runs/eval/it16d_final_rts --manifest <RTS_MANIFEST> --label it16-final --order 2 --adapter data/weights/it16/final-selected
      --board runs/rts/it16d/scoreboard.json --units-dir runs/rts/it16d/units
      && touch outputs/chain/it16d/markers/final_rts.done
    gpus: [0]
    done: outputs/chain/it16d/markers/final_rts.done
    timeout_min: 480
    on_failure: stop
    stall_min: 45
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  # Results and deltas vs base (cluster-bootstrap CIs) into a copy of the manifest; the pre-registered estimator
  # (analysis.power.paired_estimate) and the bars run on the Mac afterwards (runbook section 7).
  - name: compute
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark compute
      --units base=terminal_bench_2:runs/final/it16d/base_tb2_units.json
      --units G2=terminal_bench_2:runs/final/it16d/g2_tb2_units.json
      --units final=terminal_bench_2:runs/final/it16d/final_tb2_units.json
      --units base=impossiblebench_lcb:runs/final/it16d/base_ib_summary.json
      --units G2=impossiblebench_lcb:runs/final/it16d/g2_ib_summary.json
      --units final=impossiblebench_lcb:runs/final/it16d/final_ib_summary.json
      --units base=agentic_abstention:runs/final/it16d/base_aa_units.json
      --units G2=agentic_abstention:runs/final/it16d/g2_aa_units.json
      --units final=agentic_abstention:runs/final/it16d/final_aa_units.json
      --units base=abstentionbench:runs/final/it16d/base_abench_units.json
      --units G2=abstentionbench:runs/final/it16d/g2_abench_units.json
      --units final=abstentionbench:runs/final/it16d/final_abench_units.json
      --out runs/final/it16d/final_benchmark.json
    gpus: []
    done: runs/final/it16d/final_benchmark.json
    timeout_min: 20
    on_failure: stop

  # The RTS endpoint (prereg 6.5): final vs base and G2 vs base on the paired items, then the page, also on W&B.
  - name: rts_endpoint
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.rts.scoreboard delta
      --board runs/rts/it16d/scoreboard.json --base base --trained it16-final --out runs/rts/it16d/delta_final_base.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.rts.scoreboard delta
      --board runs/rts/it16d/scoreboard.json --base base --trained it15-g2-s1 --out runs/rts/it16d/delta_g2_base.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.rts.scoreboard plot
      --board runs/rts/it16d/scoreboard.json --out runs/rts/it16d/scoreboard.html --wandb
      && touch outputs/chain/it16d/markers/rts_endpoint.done
    gpus: []
    done: outputs/chain/it16d/markers/rts_endpoint.done
    timeout_min: 20
    on_failure: stop
    env: {WANDB_PROJECT: honest-agents, WANDB_RUN_GROUP: it16}

final:
  command: "true"
  timeout_min: 5

