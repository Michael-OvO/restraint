# Iteration 19, stage (a2): Terminal-Bench 2 and ImpossibleBench re-run for base and G2 under the external budget
# (DEF-71; docs/iteration-19-prereg-baseline.md, amendment 2026-11-01b). Same items, harness and sampling as it19a;
# the honest agent gets MAX_COMPLETION_TOKENS 49152, TURN_MAX_TOKENS 8192, MAX_TURNS 50 and a 1,024-token report
# reserve (a cut-off call is never run), the server a 65,536-token window. The internal held-out set is not re-run (it
# never hit the budget: 99 % of G2's episodes end in a report). One look per benchmark per arm.
# Node: a 5090 VM with 16 vCPU / 47 GB (it19a had 32 / 257 GB), so the Harbor concurrency is halved (TB2 6, IB 12) to
# keep per-container CPU at it19a's level; concurrency changes wall-clock only, and both arms run on this node.
# Approved by the owner (amendment 2026-11-01b; run started 2026-11-02). Gated: the first step refuses while any defect in docs/defects.md is open.
name: it19a2
state_dir: outputs/chain/it19a2
sequential: true
instance_id: null
balance_floor: 8
steps:
  - name: gate_ledger
    command: >-
      env -u VIRTUAL_ENV uv run --frozen python -m honest_agents.gate.ledger check --experiment it19a2
      --ledger docs/defects.md
      --json outputs/chain/it19a2/gate_ledger.json
      && mkdir -p outputs/chain/it19a2/markers && touch outputs/chain/it19a2/markers/gate_ledger.done
    gpus: []
    done: outputs/chain/it19a2/markers/gate_ledger.done
    after: []
    timeout_min: 5
    on_failure: stop

  # The frozen manifest is consistent (items, the internal rows file, the TB2 registry) and no training build of this
  # tree holds a benchmark item (never-trained).
  - name: freeze_checks
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark check
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark never-trained
      --out outputs/chain/it19a2/never_trained.json
      && touch outputs/chain/it19a2/markers/freeze_checks.done
    gpus: []
    done: outputs/chain/it19a2/markers/freeze_checks.done
    timeout_min: 20
    on_failure: stop

  # DEF-74 archive re-grade (docs/defects.md): the remove_input control episodes the build's own backup failed, replayed
  # in Docker and graded with the fixed grader (it19a's internal held-out rows and the it17a pool bank the CR-GRPO
  # family means come from), then a re-graded copy of each run (`analysis.apply_regrades`). CPU and Docker only. The
  # three source runs are staged in data/def74/sources (gitignored, sent by `node sync --with-data`, checked here).
  - name: def74_regrade
    command: >-
      mkdir -p runs/def74
      && printf '%s\n'
      '86d121260e6e31c73ed7ddd849962f200730d35f8635dc2394497ab9b4bdcc70  data/def74/sources/it19a_g2_heldout/episodes.jsonl.gz'
      '797e7cfba02d73c13586b1169a0a1fd89922b883fbb23fc7e9ddc17297dc9941  data/def74/sources/it19a_base_heldout/episodes.jsonl.gz'
      '23611b998e4af77d8feaf3f63a7b7c2b36ccc264f9cf4eaff182240861874600  data/def74/sources/it17_rollouts_feasible/episodes.jsonl.gz'
      | sha256sum -c -
      && for run in data/def74/sources/it19a_g2_heldout data/def74/sources/it19a_base_heldout
      data/def74/sources/it17_rollouts_feasible;
      do name=$(basename $run);
      env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.analysis.replay_episodes
      $run/episodes.jsonl* --regrade --family '' --episode-ids data/def74/affected.jsonl --tasks-root data/tasks
      --concurrency 8 --no-cache --out runs/def74/regrade_$name.jsonl --json runs/def74/regrade_$name.summary.json
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.analysis.apply_regrades
      $run runs/def74/regrade_$name.jsonl --out runs/def74/$name || exit 1; done
      && touch outputs/chain/it19a2/markers/def74_regrade.done
    gpus: []
    done: outputs/chain/it19a2/markers/def74_regrade.done
    timeout_min: 90
    on_failure: stop

  - name: merge_sft_v2
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.sft.merge --base Qwen/Qwen3.5-4B
      --adapter data/weights/it14/sft-v2-e3-final --out outputs/it14/sft_v2_e3_merged
    gpus: []
    done: outputs/it14/sft_v2_e3_merged/config.json
    timeout_min: 30
    on_failure: stop

  - name: merge_g2
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.sft.merge
      --base outputs/it14/sft_v2_e3_merged --adapter data/weights/it15/g2-s1-final --out outputs/it15/g2_merged
    gpus: []
    done: outputs/it15/g2_merged/config.json
    timeout_min: 30
    on_failure: stop

  - name: ib_tasks
    command: >-
      (cd data/ext/impossiblebench && sha256sum --check --strict --quiet MANIFEST.sha256)
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench
      materialize --data data/ext/impossiblebench/hf/impossible_livecodebench --out outputs/it19/ib_lcb_tuned
      --prompt tuned
      && touch outputs/chain/it19a2/markers/ib_tasks.done
    gpus: []
    done: outputs/chain/it19a2/markers/ib_tasks.done
    timeout_min: 20
    on_failure: stop

  - name: base_eval
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml
      -- scripts/eval_heldout.sh data/val.jsonl runs/eval/it19a2_base_sanity --limit 12 --n-samples 1 --concurrency 12
      --train-config configs/grpo_it13_2gpu.yaml
      -- env N_CONCURRENT=6 MAX_TURNS=50 MAX_COMPLETION_TOKENS=49152 TURN_MAX_TOKENS=8192 REPORT_RESERVE_TOKENS=1024
      scripts/eval_tb.sh tb2 runs/harbor/it19a2_base_tb2 -k 4
      -- env N_CONCURRENT=6 MAX_TURNS=50 MAX_COMPLETION_TOKENS=49152 TURN_MAX_TOKENS=8192 REPORT_RESERVE_TOKENS=1024
      scripts/eval_tb.sh outputs/it19/ib_lcb_tuned runs/harbor/it19a2_base_ib -k 4
      && touch outputs/chain/it19a2/markers/base_eval.done
    gpus: [0]
    done: outputs/chain/it19a2/markers/base_eval.done
    timeout_min: 720
    on_failure: stop
    stall_min: 45
    progress: {pattern: 'serve_and_run: command (\d+):', total: 3}
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", VLLM_MAX_MODEL_LEN: "65536", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: base_units
    command: >-
      mkdir -p runs/final/it19a2
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units
      --single --bench terminal_bench_2 runs/harbor/it19a2_base_tb2/tb2__* --out runs/final/it19a2/base_tb2_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench score
      runs/harbor/it19a2_base_ib/ib_lcb_tuned__* --out runs/final/it19a2/base_ib_summary.json
      && touch outputs/chain/it19a2/markers/base_units.done
    gpus: []
    done: outputs/chain/it19a2/markers/base_units.done
    timeout_min: 30
    on_failure: stop

  - name: g2_eval
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g2_merged
      -- scripts/eval_heldout.sh data/val.jsonl runs/eval/it19a2_g2_sanity --limit 12 --n-samples 1 --concurrency 12
      --train-config configs/grpo_it13_2gpu.yaml
      -- env N_CONCURRENT=6 MAX_TURNS=50 MAX_COMPLETION_TOKENS=49152 TURN_MAX_TOKENS=8192 REPORT_RESERVE_TOKENS=1024
      scripts/eval_tb.sh tb2 runs/harbor/it19a2_g2_tb2 -k 4
      -- env N_CONCURRENT=6 MAX_TURNS=50 MAX_COMPLETION_TOKENS=49152 TURN_MAX_TOKENS=8192 REPORT_RESERVE_TOKENS=1024
      scripts/eval_tb.sh outputs/it19/ib_lcb_tuned runs/harbor/it19a2_g2_ib -k 4
      && touch outputs/chain/it19a2/markers/g2_eval.done
    gpus: [0]
    done: outputs/chain/it19a2/markers/g2_eval.done
    timeout_min: 720
    on_failure: stop
    stall_min: 45
    progress: {pattern: 'serve_and_run: command (\d+):', total: 3}
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", VLLM_MAX_MODEL_LEN: "65536", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: g2_units
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units
      --single --bench terminal_bench_2 runs/harbor/it19a2_g2_tb2/tb2__* --out runs/final/it19a2/g2_tb2_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench score
      runs/harbor/it19a2_g2_ib/ib_lcb_tuned__* --out runs/final/it19a2/g2_ib_summary.json
      && touch outputs/chain/it19a2/markers/g2_units.done
    gpus: []
    done: outputs/chain/it19a2/markers/g2_units.done
    timeout_min: 30
    on_failure: stop

final:
  command: "true"
  timeout_min: 5

watch:
  pull_paths: [runs/def74, runs/harbor/it19a2_base_tb2, runs/harbor/it19a2_base_ib, runs/harbor/it19a2_g2_tb2, runs/harbor/it19a2_g2_ib,
               runs/final/it19a2, outputs/chain/it19a2/never_trained.json, outputs/logs]
  archives:
    - {iteration: 19, name: it19a2-external-budget, no_weights: true,
       eval: [runs/eval/it19a2_base_sanity, runs/eval/it19a2_g2_sanity, runs/def74/it19a_g2_heldout,
              runs/def74/it19a_base_heldout, runs/def74/it17_rollouts_feasible],
       file: [runs/final/it19a2/base_tb2_units.json, runs/final/it19a2/g2_tb2_units.json,
              runs/final/it19a2/base_ib_summary.json, runs/final/it19a2/g2_ib_summary.json,
              outputs/chain/it19a2/never_trained.json, runs/def74/regrade_it19a_g2_heldout.jsonl,
              runs/def74/regrade_it19a_base_heldout.jsonl, runs/def74/regrade_it17_rollouts_feasible.jsonl],
       note: "iteration 19 stage (a2): TB2 and ImpossibleBench for base and G2 under the external budget (DEF-71)"}
