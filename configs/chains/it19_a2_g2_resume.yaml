# Iteration 19, stage (a2), the G2 arm resumed (2026-11-02). In configs/chains/it19_a2_g2.yaml the Harbor process of
# G2's TB2 job grew to 40 GB resident on the 47 GB VM and the kernel's OOM killer ended it at 290 of 356 trials
# (14:52 UTC; the base arm's Harbor process on the same machine type stayed near 1.4 GB). TB2 is resumed in place
# (`harbor jobs resume`: the job's own config, finished trials kept), then G2's ImpossibleBench runs as that job file
# would have run it (same agent, budget and concurrency as the base arm), then the G2 units. Approved under the owner's
# delegation of 2026-11-02.
name: it19a2g2r
state_dir: outputs/chain/it19a2g2r
sequential: true
instance_id: null
balance_floor: 8
steps:
  - name: g2_tb2_resume_ib
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g2_merged
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval harbor jobs resume
      -p runs/harbor/it19a2_g2_tb2/tb2__policy__honest__20261102_120809
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.harbor_results
      runs/harbor/it19a2_g2_tb2/tb2__policy__honest__20261102_120809
      -- env N_CONCURRENT=6 MAX_TURNS=50 MAX_COMPLETION_TOKENS=49152 TURN_MAX_TOKENS=8192 REPORT_RESERVE_TOKENS=1024
      scripts/eval_tb.sh outputs/it19/ib_lcb_tuned runs/harbor/it19a2_g2_ib -k 4
      && mkdir -p outputs/chain/it19a2g2r/markers && touch outputs/chain/it19a2g2r/markers/g2_tb2_resume_ib.done
    gpus: [0]
    done: outputs/chain/it19a2g2r/markers/g2_tb2_resume_ib.done
    after: []
    timeout_min: 1200
    on_failure: stop
    stall_min: 120
    env: {UV_NO_SYNC: "1", VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", VLLM_MAX_MODEL_LEN: "65536", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: g2_units
    command: >-
      mkdir -p runs/final/it19a2
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units
      --single --bench terminal_bench_2 runs/harbor/it19a2_g2_tb2/tb2__* --out runs/final/it19a2/g2_tb2_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench score
      runs/harbor/it19a2_g2_ib/ib_lcb_tuned__* --out runs/final/it19a2/g2_ib_summary.json
      && touch outputs/chain/it19a2g2r/markers/g2_units.done
    gpus: []
    done: outputs/chain/it19a2g2r/markers/g2_units.done
    timeout_min: 30
    on_failure: stop
    env: {UV_NO_SYNC: "1"}

sanity_runs:  # G2's 12-task sanity run of this chain's first job (configs/chains/it19_a2_g2.yaml)
  outputs/it15/g2_merged: runs/eval/it19a2_g2_sanity

final:
  command: "true"
  timeout_min: 5

watch:
  pull_paths: [runs/harbor/it19a2_g2_tb2, runs/harbor/it19a2_g2_ib, runs/final/it19a2, runs/eval/it19a2_g2_sanity,
               outputs/chain/it19a2g2/never_trained.json, outputs/logs]
