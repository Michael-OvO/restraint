# Iteration 15 G4 (docs/iteration-15-g4-read-rft.md): rejection-sampling fine-tuning on G2's own read-first decisions.
# (a) sample G2 seed 1 (outputs/it15/g2_merged) 4x on the 400 training-surface tasks (data/decision/read_rft_tasks.jsonl,
#     built by honest_agents.tasks.read_rft_tasks), transcripts kept (runs/eval/it15_g4_sample/transcripts) and a trajectory
#     bank written for the SFT stage (runs/eval/it15_g4_sample/bank); (b) SFT on the kept episodes + the G2 anchors
#     (kind read_rft; fails clearly with < 200 kept); (c) merge onto g2_merged; (d) surface4 and tier S evaluations.
# No eval server runs while the SFT trains: every step depends on the one before it, and the sampling server is torn down by
# serve_and_run.sh when (a) ends. owner-approved: balance_floor 15 (below the usual 25) for this chain.
name: it15g4
state_dir: outputs/chain/it15g4
sequential: true
instance_id: null
balance_floor: 15
steps:
  - name: sample_g4
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g2_merged
      -- scripts/eval_heldout.sh data/decision/read_rft_tasks.jsonl runs/eval/it15_g4_sample --n-samples 4
      --concurrency 24 --train-config configs/grpo_it13_2gpu.yaml --bank-dir runs/eval/it15_g4_sample/bank
    gpus: [0]
    done: runs/eval/it15_g4_sample/metrics.json
    after: []
    timeout_min: 240
    on_failure: stop
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}
  - name: train_g4
    command: >-
      scripts/run_sft.sh configs/sft_read_rft_g4_qwen35.yaml model.name=outputs/it15/g2_merged
    gpus: [0]
    done: outputs/sft/it15-g4-read-rft/final/adapter_config.json
    after: [sample_g4]
    timeout_min: 180
    on_failure: stop
    env: {CUDA_VISIBLE_DEVICES: "0", WANDB_PROJECT: honest-agents, WANDB_ENTITY: michael_ovo, WANDB_RUN_GROUP: it15, PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"}
  - name: merge_g4
    command: >-
      env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.sft.merge
      --base outputs/it15/g2_merged --adapter outputs/sft/it15-g4-read-rft/final --out outputs/it15/g4_merged
    gpus: []
    done: outputs/it15/g4_merged/config.json
    after: [train_g4]
    timeout_min: 30
    on_failure: stop
  - name: g4_surface4
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g4_merged
      -- scripts/eval_heldout.sh data/decision/surfaces_val/tasks runs/eval/it15_g4_surface4 --n-samples 4
      --concurrency 24 --train-config configs/grpo_it13_2gpu.yaml
    gpus: [0]
    done: runs/eval/it15_g4_surface4/metrics.json
    after: [merge_g4]
    timeout_min: 120
    on_failure: continue
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}
  - name: g4_tierS
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml model.name=outputs/it15/g4_merged
      -- scripts/eval_heldout.sh data/probe_v1.jsonl runs/eval/it15_g4_tierS --n-samples 2 --concurrency 24
      --train-config configs/grpo_it13_2gpu.yaml
    gpus: [0]
    done: runs/eval/it15_g4_tierS/metrics.json
    after: [merge_g4]
    timeout_min: 90
    on_failure: continue
    env: {VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", BASE_URL: "http://localhost:8000/v1", MODEL: policy}
final:
  command: "true"
  timeout_min: 5
