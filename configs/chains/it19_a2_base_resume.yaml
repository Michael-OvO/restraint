# Iteration 19, stage (a2), the base arm's ImpossibleBench run resumed (2026-11-02). The original job file
# (configs/chains/it19_a2_external_budget.yaml) gave base_eval 720 min; base TB2 took 3.4 h and base ImpossibleBench
# runs about 12 h at Harbor concurrency 6, so the step would have been killed part-way. Its runner was stopped and the
# Harbor job is resumed in place (`harbor jobs resume`: the job's own config, so the same agent, budget, items and
# concurrency; finished trials are kept), then the base units are written. G2 runs on its own node
# (configs/chains/it19_a2_g2.yaml). Approved under the owner's delegation of 2026-11-02.
name: it19a2b
state_dir: outputs/chain/it19a2b
sequential: true
instance_id: null
balance_floor: 8
steps:
  - name: base_ib_resume
    command: >-
      scripts/serve_and_run.sh configs/grpo_it13_2gpu.yaml
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval harbor jobs resume
      -p runs/harbor/it19a2_base_ib/ib_lcb_tuned__policy__honest__20261102_100047
      -- env -u VIRTUAL_ENV uv run --frozen --extra train --extra eval python -m honest_agents.eval.harbor_results
      runs/harbor/it19a2_base_ib/ib_lcb_tuned__policy__honest__20261102_100047
      && mkdir -p outputs/chain/it19a2b/markers && touch outputs/chain/it19a2b/markers/base_ib_resume.done
    gpus: [0]
    done: outputs/chain/it19a2b/markers/base_ib_resume.done
    after: []
    timeout_min: 1200
    on_failure: stop
    stall_min: 120
    env: {UV_NO_SYNC: "1", VLLM_GPUS: "0", VLLM_PORT: "8000", VLLM_GPU_MEM: "0.85", VLLM_MAX_MODEL_LEN: "65536", BASE_URL: "http://localhost:8000/v1", MODEL: policy}

  - name: base_units
    command: >-
      mkdir -p runs/final/it19a2
      && env -u VIRTUAL_ENV uv run --frozen --extra eval python -m honest_agents.eval.final_benchmark units
      --single --bench terminal_bench_2 runs/harbor/it19a2_base_tb2/tb2__* --out runs/final/it19a2/base_tb2_units.json
      && env -u VIRTUAL_ENV uv run --frozen --extra train python -m honest_agents.eval.external.impossiblebench score
      runs/harbor/it19a2_base_ib/ib_lcb_tuned__* --out runs/final/it19a2/base_ib_summary.json
      && touch outputs/chain/it19a2b/markers/base_units.done
    gpus: []
    done: outputs/chain/it19a2b/markers/base_units.done
    timeout_min: 30
    on_failure: stop
    env: {UV_NO_SYNC: "1"}

final:
  command: "true"
  timeout_min: 5

watch:
  pull_paths: [runs/def74, runs/harbor/it19a2_base_tb2, runs/harbor/it19a2_base_ib, runs/final/it19a2,
               runs/eval/it19a2_base_sanity, outputs/chain/it19a2/never_trained.json, outputs/logs]
