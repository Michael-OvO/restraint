# First real GRPO run on ONE GPU: Qwen3.5-4B with vLLM colocated in the training process (no server, no second GPU),
# honesty reward alpha 0.1, warm start from the BASE model.
#   scripts/run_slot.sh configs/grpo_colocate_qwen35.yaml [key.path=value ...]
# Why these values (measured, runs/passk and runs/eval/val_*, docs/node-runbook.md):
# - alpha 0.1: the difficulty gate on the pass@4 bank (tasks.difficulty --rollouts 4 --min-pass 2 --max-pass 3) finds only
#   alpha 0 and 0.1 safe (a calibrated policy claims iff p(success) > (1 + alpha) / 2; 0.25 would let blanket declining win on
#   this pool). The pool is built by tasks.rl_pool: feasible rows gated by the difficulty file, never-passing feasible
#   sources and leaky twins removed, impossible twins per family (high_risk and remove_input oversampled, revoke_permission
#   capped), each with its near-miss control, written in step blocks of 8 rows with distinct sources:
#     python -m honest_agents.tasks.rl_pool --config configs/tasks/rl_pool.yaml
# - data order: TRL's RepeatSampler with shuffle_dataset false draws the rows in file order, 8 per optimizer step
#   (generation_batch_size 1 x 64 = 64 // num_generations 8), so step k trains rows [8k, 8k + 8) of train_rl.jsonl.
#   pair_batches false keeps that order (pair_batches would put a twin, its control and its plain copy in one step).
#   Rebuild train_rl.jsonl with the command above first: the iteration-9 file is in pool order (a source's rows side by
#   side), and nothing at train time re-checks the blocks.
# - no SFT warm start: report-only SFT made the model quit (zero commands in 82 % of episodes) and best-of-N + hindsight
#   SFT lowered verified success 72.9 -> 59.2 % on validation with no honesty gain, so RL starts from the base model.
# - learning rate 3e-5 (base.yaml: 1e-5): at 1e-5 a LoRA update can round away when merged into the bf16 weights that vLLM
#   samples from (design.md "Weight sync"), and a short run has few steps. The stop rules stay on.
# - Weight sync in the colocated path is NOT covered by scripts/sync_check.sh (it needs a server and two GPUs): verify
#   learning by behaviour (reward and validation-probe movement, importance ratio near 1 AFTER the first update).
base: base.yaml
model:
  name: Qwen/Qwen3.5-4B
  family: qwen3_5
reward:
  mode: honest
  config:
    alpha: 0.1
    # Naming a blocker beats "I could not finish" when p(the blocker is real) > (alpha - false_blame) /
    # (1 - wrong_reason + alpha - false_blame) (reward.RewardConfig). At false_blame 0 that is 17 %, and the first run's
    # false blame rose from 0.5 % to 3-4 % of feasible episodes in 18 steps. -0.4 puts it at 50 %: blame only when more
    # likely than not. Satisfies beta (1.0) > wrong_reason - min(no_report_feasible, lazy, false_blame) = 0.9.
    false_blame: -0.4
data:
  train_file: data/train_rl.jsonl
  pair_batches: false     # the order is tasks.rl_pool's step blocks (see the header)
probe:
  every_steps: 20          # a multiple of grpo.save_steps
vllm:
  startup_probe: false     # nothing to probe: the engine is in-process
grpo:
  shuffle_dataset: false   # draw train_rl.jsonl in file order (tasks.rl_pool block_size 8)
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  vllm_tensor_parallel_size: 1
  learning_rate: 3.0e-5
  warmup_steps: 5
  max_steps: 50
  save_steps: 10
