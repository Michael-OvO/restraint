# Report-only pilot (SPEC_V3 §6, §8 stage 2): train only the final report on frozen Phase-0 trajectories.
#   python -m honest_agents.pilot.run --config configs/pilot.yaml [--dry-run] [--shard 0/2] [key.path=value ...]
# Sweep: alpha x scale_rewards {none, group} x 3 seeds. `none` is the target (SPEC_V3 §5.1); `group` is the ablation that
# should erase alpha (go/no-go review TDC-3). One training process per run (SPEC_V3 §5.2), generation by a vLLM server on
# its own GPU, no Docker, no sandbox. Run scripts/sync_check.sh first: this is the first run that learns (SPEC_V3 §10.1).
# Not a statement about effort or action-level abstention: see `honest_agents.pilot.__doc__`.
seed: 42
output_root: outputs/pilot

model:
  name: Qwen/Qwen3.5-4B
  family: qwen3_5          # auto | qwen3 | qwen3_5
  dtype: bfloat16
  strict_template: true
  require_fla: true

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: auto

data:
  bank: outputs/phase0                   # searched for bank-*.jsonl; the zero-lr run writes <run>/bank/ (configs/phase0_zero_lr.yaml)
  dataset_file: outputs/pilot/pilot.jsonl
  rebuild: false
  min_rows: 800                          # >= max_steps x prompts per round: every prompt is shown once
  max_epochs: 1.0                        # a repeated prompt has a fixed outcome and can be memorised (run.check_epochs)
  build:                                 # honest_agents.pilot.dataset.BuildOptions
    mix: default                         # 55 / 20 / 25 feasible / control / infeasible (SPEC_V3 §4.5)
    include_no_report: true              # forced report turns: the budget-exhausted trajectories are where fabrication is
    max_per_variant: 8
    max_context_chars: 40000
    seed: 0

reward:
  mode: honest
  config: {}                             # RewardConfig fields except alpha (the sweep sets it)

sweep:
  alpha: [0.0, 0.25, 0.5, 0.75]
  scale_rewards: [none, group]
  seeds: [42, 43, 44]                    # 3 seeds: the verdict's intervals cover seed variance too (audit2 SP5); no sandbox, so cheap

launch:
  num_processes: 1
  vllm_max_model_len: 20480              # must equal the server's --max-model-len (scripts/serve_vllm.sh)

analysis:                                # honest_agents.pilot.analyze.StopRule: the SPEC_V3 §6 stop rule
  window_rounds: 10
  min_claim_spread: 0.10                 # smallest fall of the claim rate over the alpha range worth having (nominal about 0.3)
  min_fabrication_drop: 0.05
  min_initial_fabrication: 0.10
  min_claim_rate: 0.05
  min_discrimination: 0.10
  min_report_rate: 0.70
  min_failed_prompts: 10                 # distinct prompts with a failure per window: a degeneracy guard, not a power gate
  threshold_tolerance: 0.15
  n_boot: 1000                           # cluster bootstrap over prompts (and seeds); every check is an interval
  ci_level: 0.90                         # two-sided: each tail 5%

grpo:                                    # trl.GRPOConfig fields (validated at startup)
  loss_type: dapo
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  mask_truncated_completions: true
  # 8 prompts x 8 reports per round = 64 completions (per_device 2 x steps_per_generation 32); one round per step.
  num_generations: 8
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 32
  max_completion_length: 2048            # one report turn, thinking included
  generation_kwargs:
    max_tokens: 2048
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  learning_rate: 1.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 5
  max_grad_norm: 1.0
  max_steps: 100                         # 100 steps x 8 prompts = 800 distinct frozen trajectories, one epoch
  gradient_checkpointing: true
  bf16: true
  use_vllm: true
  vllm_mode: server
  vllm_server_base_url: http://127.0.0.1:8000
  vllm_server_timeout: 1800
  vllm_importance_sampling_correction: true   # server must run with --logprobs-mode processed_logprobs
  vllm_importance_sampling_mode: token_truncate
  logging_steps: 1
  log_completions: true
  num_completions_to_print: 0
  report_to: none
  save_strategy: steps
  save_steps: 25
  save_total_limit: null                 # keep every checkpoint (SPEC_V3 §5.4, §9.3.1)
