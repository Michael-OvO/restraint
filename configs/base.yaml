# Base GRPO run (docs/design.md section 8): Qwen3-4B bring-up model, honesty reward (alpha=0.25).
# ONE training process per run. On a 4xH100 node two runs go side by side, one per "slot":
#   slot 0: train on GPU 0, vLLM on GPU 1, port 8000, NCCL group port 51216
#   slot 1: train on GPU 2, vLLM on GPU 3, port 8001, NCCL group port 51217
# (scripts/run_slot.sh / run_pair.sh set the per-slot overrides; see scripts/_common.sh).
# Every key under `grpo:` is a trl.GRPOConfig field (validated at startup). run_name/output_dir/seed/reward_weights/
# model_init_kwargs, cast_lm_head_to_fp32 and the evaluation fields are derived from the other sections.
seed: 42
output_root: outputs

model:
  name: Qwen/Qwen3-4B
  family: auto            # auto | qwen3 | qwen3_5
  dtype: bfloat16
  strict_template: true   # fail unless the rollout chat template is a known template AND prefix-preserving for our tool flow
  require_fla: true       # Qwen3.5 only
  cast_lm_head_to_fp32: false   # needs untied embeddings; checked against the model config at startup

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: auto    # honest_agents.models.lora_target_modules(family)

data:
  train_file: data/train.jsonl
  eval_file: data/val.jsonl   # fixed validation split for the periodic probe; never the test split
  probe_file: null            # fixed probe list (python -m honest_agents.tasks.probe_set); used whole, wins over eval_file.
                              # Keep it under data/ (data/probe.jsonl): node sync --with-data sends data/, never runs/
  max_rows: null
  pair_batches: true      # keep feasible/infeasible variants of a pair_id in the same prompt batch
  allow_legacy_verifier: false   # tasks must say [metadata.honest] verifier = "pytest"
  check_tasks: true
  require_expected_targets: true

env:
  environment_type: docker
  max_concurrent_boots: 16   # per training process
  command_timeout_sec: 60    # timeout -k 5 <this> around every command
  tests_timeout_sec: 180
  enforce_network_policy: true

reward:
  mode: honest            # honest | outcome | outcome_claimed | outcome_reflect (one reward function, weight 1)
  config:                 # honest_agents.reward.RewardConfig fields; efficiency_ref_actions is set from the call budget
    alpha: 0.25

launch:
  num_processes: 1        # must stay 1 with a vLLM server; must match configs/accelerate/*.yaml

vllm:
  prompt_token_reserve: 3072   # system prompt + tool schemas + instruction; checked with the real tokenizer at start
  max_model_len: null          # null = prompt reserve + max_completion_length + per-turn cap; asserted on the server
  startup_probe: true          # fail at start if the server cannot return token ids / processed logprobs / full distribution

probe:                  # periodic held-out probe, TRL's evaluation loop over data.probe_file or a fixed subset of data.eval_file
  every_steps: 50       # must be a multiple of grpo.save_steps: each probed step has a checkpoint
  max_variants: 100     # size of the eval_file subset (a probe_file is used whole)
  batch_size: 25        # episodes in flight; a multiple of samples_per_variant
  on_start: true        # baseline probe of the untrained policy
  selection_metric: eval_honest/task_success
  samples_per_variant: 1  # episodes per variant; cost = rows x this per probe (`--dry-run` prints episodes_per_probe)
  min_infeasible: 60    # floors for a probe_file: fewer impossible / feasible variants are refused
  min_feasible: 60

stop:                   # callbacks.StopRuleConfig (docs/design.md section 8)
  enabled: true
  action: stop          # stop | warn
  window: 20
  min_claim_rate_feasible: 0.05
  max_zero_variance_group_share: 0.5
  max_decline_rate_feasible: 0.8      # set from the Phase-0 measurement
  max_masked_share: 0.15
  masked_fail_share: 0.5              # fail fast: masked share >= this on masked_fail_patience consecutive steps stops the run (exit 3)
  masked_fail_patience: 2
  max_reward_error_rate: 0.05         # every grading failure after the agent acted (or masked): a grader bug
  max_tamper_rate: 0.10               # also counts those grading failures; short window, -1.5 drives the policy
  tamper_window: 5
  max_is_ratio_deviation: 0.05        # window-mean sampler/trainer importance ratio must stay within 1 +- this
  max_is_ratio_at_cap_share: 0.05
  max_truncated_share: 0.30           # absolute ceiling on completions/clipped_ratio
  task_success_drop: 0.10
  report_rate_drop: 0.15
  val_task_success_drop: 0.05
  val_patience: 2
  # Capability on the fixed probe, against the step-0 probe on the same variants (the evaluation protocol's stop rule):
  # control verified success down, or control decline / zero-command rate up, by more than this on `patience`
  # consecutive probes. ~8 points of noise at 64 controls x 1 sample, ~4 at 4 samples (callbacks.py derives it);
  # train.health warns from 10 points. 1.0 turns the rule off; stop vs warn follows `action`.
  probe_capability_drop: 0.15
  probe_capability_patience: 2

bank:
  enabled: false        # Phase 0 turns it on
  dir: null             # default <output_dir>/bank
  quarantine_file: null # default <output_dir>/quarantine.jsonl

trainer:
  max_tool_workers: null   # null = one thread per live episode
  trim_padding: true       # forward passes on length-trimmed chunks instead of the batch-global padding (same loss)
  sort_micro_batches: true # regroup a round's micro-batches by length, longest first (dapo only; no effect at batch 1)
  execute_pending_report: true # run a report call written as the last turn at the turn cap (iteration 13; eval follows)

wandb:                     # train.dashboard; used only when grpo.report_to names wandb
  project: honest-agents
  name: null               # the iteration slug (wandb.name=it11-<slug>); null = run_name. Entity: WANDB_ENTITY
  group: null
  tags: []
  health: true             # train.health levels per step, one alert per check on its first FAIL

grpo:
  # Loss (docs/design.md section 8): DAPO token-level aggregation, no KL / reference model, clip-higher.
  loss_type: dapo
  beta: 0.0
  # PPO clipping never binds here: a generation round is one optimizer step, so the policy that scores a token is the
  # one that sampled it (old logps come from the same weights) and the ratio is 1 up to float noise at learning rates
  # of 1e-5. The defaults stay; `clip_ratio/region_mean` is logged each step and should read ~0. The drift that matters
  # is sampler vs trainer: `sampling/importance_sampling_ratio/{mean,at_cap_share,outside_band_share}`.
  epsilon: 0.2
  epsilon_high: 0.28
  scale_rewards: none               # group would erase alpha; train/ rejects anything else
  mask_truncated_completions: true
  # Rollouts: 8 prompts x 8 generations = 64 episodes per generation round = one optimizer step
  # (per_device 1 x 1 process x gradient_accumulation_steps 64; steps_per_generation defaults to grad accum).
  # per_device_train_batch_size stays 1 until the memory headroom is measured on the node (audit T1): the 4B model's
  # logits for 2 x ~16k tokens are ~15 GiB in bf16 plus ~30 GiB for an fp32 copy. HonestGRPOTrainer already trims padding
  # and length-sorts micro-batches, so the saving from 2 is small; raise it (and halve gradient_accumulation_steps)
  # only after `gpu/peak_memory_gb` of a Phase-0 round shows room. The loss is token-sum normalised (dapo), so the
  # value does not depend on the split.
  num_generations: 8
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 64
  # Limits: the ONE place they live. EpisodeBudget (env), the efficiency reference and vLLM --max-model-len derive from these.
  max_completion_length: 16384      # total budget across all turns, tool output included
  max_tool_calling_iterations: 30   # bash budget = this - 2
  generation_kwargs:
    max_tokens: 4096                # per-turn cap, identical in evaluation
  # Sampling: the full distribution, set explicitly (docs/design.md section 8). TRL sends all of these on every request.
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  min_p: 0.0
  repetition_penalty: 1.0
  # Optimisation (LoRA)
  learning_rate: 1.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 5
  max_grad_norm: 1.0
  max_steps: 300
  gradient_checkpointing: true
  bf16: true
  # Generation via external vLLM server (scripts/serve_vllm.sh, which starts it with --generation-config vllm)
  use_vllm: true
  vllm_mode: server
  vllm_server_base_url: http://127.0.0.1:8000
  vllm_group_port: 51216
  vllm_server_timeout: 1800
  vllm_importance_sampling_correction: true   # server runs with --logprobs-mode processed_logprobs
  vllm_importance_sampling_mode: token_truncate
  vllm_importance_sampling_clip_max: 3.0
  # Sandbox reset + grading can take minutes per step.
  ddp_timeout: 10800
  # Logging / checkpoints: every checkpoint is kept, the validation probe picks one afterwards.
  logging_steps: 1
  log_completions: true
  num_completions_to_print: 0
  report_to: none           # grpo.report_to=wandb turns on the dashboard (the `wandb:` section); WANDB_MODE=disabled turns it off
  save_strategy: steps
  save_steps: 25
  save_total_limit: null
